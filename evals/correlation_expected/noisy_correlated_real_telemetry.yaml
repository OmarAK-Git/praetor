# schema: see README.md in this directory
schema_version: "1"
scenario_id: noisy_correlated_real_telemetry
description: >
  Phase 3 noisy real telemetry: process chain + Security 4624 corroboration with
  ambiguous Sysmon (1003) and unrelated in-window Sysmon (1004 on WORKSTATION2).
  Binding discrimination is the window filter (out-of-window record 9999 excluded).
  Cross-host in-window noise (1004) is dropped by correlator host isolation (V2-014);
  same-host incidental noise (1003) remains bounded.

inputs:
  anchor_time: "2026-06-08T12:00:00+00:00"
  window_seconds: 300
  sysmon_fixtures:
    - tests/fixtures/sysmon/process_chain.json
    - tests/fixtures/sysmon/ambiguous_user.json
    - tests/fixtures/sysmon/noise_in_window_unrelated.json
    - tests/fixtures/sysmon/noise_outside_window.json
  security_fixtures:
    - tests/fixtures/security/successful_logon_4624.json
  noise_fixtures:
    - tests/fixtures/sysmon/ambiguous_user.json
    - tests/fixtures/sysmon/noise_in_window_unrelated.json

fixture_manifest: tests/fixtures/fixture_manifest.yaml

expectations:
  required_record_ids:
    - "1001"
    - "1002"
    - "2001"
  excluded_record_ids:
    - "9999"
    - "1004"
  required_process_relationships:
    - parent_process_guid: "{11111111-1111-1111-1111-111111111111}"
      child_process_guid: "{22222222-2222-2222-2222-222222222222}"
  min_collected_facts: 3
  max_collected_facts: 4
  max_noise_overcollection: 1
  require_account_corroboration: true
  required_provenance_paths:
    - sysmon_event_log
    - windows_security_log
  required_ambiguity_flag_record_ids:
    - "1003"
