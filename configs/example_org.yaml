version_metadata:
  org_id: example-corp
  config_version: "1.0.0"

known_principals:
  service_accounts:
    - principal_id: backup-svc
      description: nightly backup agent

assets_and_asset_groups:
  entries:
    - asset_id: dc-01
      description: domain controller
      subnet_membership: 10.0.0.0/24
    - asset_id: eng-workstation-pool
      description: engineering workstations
      subnet_membership: 10.10.0.0/24

normal_admin_patterns:
  patterns:
    - name: scheduled_patch_window
      description: Tuesday maintenance window

containment_exclusions:
  never_contain:
    - target_type: host
      target_id: dc-01
    - target_type: host
      target_id: backup-gateway

business_context:
  notes: Example org for development and tests.

containment_policy:
  precedence:
    - deny_over_allow
  rules:
    - name: default_escalate
      action: escalate
      scope: global

account_auto_contain_enabled: false

directive_lifetime_policy:
  max_lifetime_seconds: 300

emergency_never_contain_policy:
  max_lifetime_seconds: 172800

rate_limit_policy:
  scopes:
    - per_host
    - per_subnet
    - per_asset_group

provider_health_circuit_breaker_policy:
  window_seconds: 60
  failure_threshold: 5
  success_reset_threshold: 3
  probe_rate_limit_per_minute: 10

containment_circuit_breaker_policy:
  window_seconds: 60
  failure_threshold: 5
  success_reset_threshold: 3

revocation_feed_policy:
  max_revocation_feed_propagation_delay_seconds: 60
  max_feed_export_retries: 3

consumer_clock_skew_policy:
  max_consumer_clock_skew_seconds: 30

latency_and_queue_aging_policy:
  max_queue_age_seconds: 120

provisional_alert_rate_targets:
  sustained_alerts_per_minute: 30
  burst_alerts_per_minute: 60
