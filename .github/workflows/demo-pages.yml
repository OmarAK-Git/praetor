name: demo-pages

# Rebuilds demo/index.html from the live engine and publishes it to GitHub Pages,
# so the public demo can never drift from the code it claims to demonstrate.
# Requires Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: ["master"]
    paths:
      - "notebooks/walkthrough_scenarios.py"
      - "src/praetor/**"
      - "configs/example_org.yaml"
      - "pyproject.toml"
      - "tools/build_demo_page.py"
      - "demo/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Praetor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build the demo page from the live engine
        run: python tools/build_demo_page.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
