[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praetor"
version = "0.1.0"
description = "Post-detection disposition-policy engine for SOCs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
    "pysigma>=1.3",
    "pysigma-backend-splunk>=1.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: requires external services or credentials",
    "probabilistic: non-deterministic; results logged only, not a CI gate",
]
addopts = '-m "not integration and not probabilistic"'

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["praetor", "consumer_sdk", "evals"]
# `mypy .` (the documented gate command) otherwise aborts with "Duplicate module
# named conftest" and would strict-check the untyped test tree, which the
# packages-based config never covered. Pin src-layout resolution and restrict
# the positional `.` scan to the real source packages: tests keep their own
# (relaxed) override when checked explicitly, and non-source tooling trees are
# excluded entirely.
mypy_path = "src"
explicit_package_bases = true
exclude = [
    '^tests/',
    '^tools/',
    '^\.workflow/',
    '^\.claude/',
    '^notebooks/',
    '^build/',
    '^awesome-ai-workflow/',
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
# Demo walkthrough + its generator: not linted source (mirrors mypy exclude).
# Semantic pins live in notebooks/check_walkthrough.py.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/praetor/config/**/*.py" = ["E501"]
"tests/config/**/*.py" = ["E501"]
"src/praetor/engine/**/*.py" = ["E501"]
"tests/engine/**/*.py" = ["E501"]
"evals/**/*.py" = ["E501"]
"tests/evals/**/*.py" = ["E501"]
"tests/detections/**/*.py" = ["E501"]
"tests/splunk/**/*.py" = ["E501"]
"tools/**/*.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/praetor"]

[tool.hatch.build.targets.wheel.force-include]
"src/praetor/py.typed" = "praetor/py.typed"
