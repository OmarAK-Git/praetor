[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praetor"
version = "0.1.0"
description = "Post-detection disposition-policy engine for SOCs"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/praetor"]
