[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praetor"
version = "0.1.0"
description = "Post-detection disposition-policy engine for SOCs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["praetor"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/praetor/config/**/*.py" = ["E501"]
"tests/config/**/*.py" = ["E501"]
"src/praetor/engine/**/*.py" = ["E501"]
"tests/engine/**/*.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/praetor"]
