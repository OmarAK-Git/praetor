[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Successful Security Logon (4624)]
description = Detects Windows Security event 4624 in committed fixture telemetry
search = source="WinEventLog:Security" source="WinEventLog:Security" EventCode=4624 Channel="Security"

[Calculator Process Creation]
description = Detects calc.exe process creation in committed Sysmon fixtures
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\calc.exe"

[Windows Command Shell Execution]
description = Detects cmd.exe process creation in committed Sysmon fixtures
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\cmd.exe"

[Notepad Process Creation]
description = Detects notepad.exe process creation in committed Sysmon fixtures
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\notepad.exe"

[Suspicious PowerShell Encoded Command]
description = Detects PowerShell with encoded command line in committed Sysmon fixtures
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\powershell.exe" CommandLine="*-enc*"
